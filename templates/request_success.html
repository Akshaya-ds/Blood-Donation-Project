<!DOCTYPE html>
<html>

<head>
<title>Request Sent</title>

<style>

body{
margin:0;
padding:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff4b5c,#ff758c);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.card{
background:white;
padding:40px;
border-radius:25px;
width:420px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.2);
animation:pop .6s ease;
}

@keyframes pop{
0%{
transform:scale(.5);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

.icon{
font-size:70px;
margin-bottom:20px;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%{transform:scale(1);}
25%{transform:scale(1.1);}
50%{transform:scale(1);}
75%{transform:scale(1.1);}
100%{transform:scale(1);}
}

h1{
color:#ff4b5c;
margin-bottom:10px;
}

p{
color:#555;
font-size:16px;
line-height:1.6;
margin-bottom:25px;
}

.info{
background:#fff0f0;
padding:15px;
border-radius:15px;
margin-bottom:25px;
}

.info p{
margin:8px 0;
font-weight:500;
}

button{
background:#ff4b5c;
color:white;
border:none;
padding:14px 25px;
font-size:16px;
border-radius:12px;
cursor:pointer;
transition:.3s;
width:100%;
}

button:hover{
background:#ff1e3c;
transform:translateY(-2px);
}

</style>
</head>

<body>

<div class="card">

<div class="icon">🩸</div>

<h1>Request Sent Successfully!</h1>

<p>
Your blood request has been successfully sent to the donor.
Please wait for donor response.
</p>

<div class="info">

<p>🧑 Patient: {{patient_name}}</p>

<p>❤️ Blood Group: {{blood_group}}</p>

<p>👨‍⚕️ Donor: {{donor_name}}</p>

<p>📌 Status: Pending Approval</p>

</div>

<a href="/dashboard">
<button>
Back to Dashboard
</button>
</a>

</div>

</body>
</html>
